<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offpack</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;700&display=swap">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="lg" viewBox="264 222 520 520"><path fill="currentColor" fill-rule="evenodd" d="M632 291.14 L632 380 L714.38 380 A228 228 0 1 1 632 291.14 Z M389 485 a123 123 0 1 0 246 0 a123 123 0 1 0 -246 0 Z"/><rect x="665" y="245" width="100" height="100" style="fill:var(--mark)"/></symbol></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="i-journal" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-ins" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
</svg>
<div id="boot">Loading...</div>
<header class="app-top">
  <a class="brand" href="app.html"><svg class="mark" aria-hidden="true"><use href="#lg"/></svg><span class="bname"><b>OFFPACK</b></span></a>
</header>
<main class="app-main">
  <h1 id="hello">Welcome.</h1>
  <section class="card">
    <h3>Setup check</h3>
    <div id="check"></div>
    <p class="muted" style="font-size:13px;margin-top:10px">Temporary. This card goes away when the real Home arrives in the next stage.</p>
  </section>
  <section class="card">
    <h3>Appearance</h3>
    <div class="seg">
      <button type="button" data-theme-set="system">System</button>
      <button type="button" data-theme-set="dark">Dark</button>
      <button type="button" data-theme-set="light">Light</button>
    </div>
    <button type="button" class="btn ghost" id="signout">Log out</button>
  </section>
</main>
<nav class="tabs" aria-label="Main">
  <button type="button" class="on" aria-current="page"><svg aria-hidden="true"><use href="#i-home"/></svg>Home</button>
  <button type="button" data-soon><svg aria-hidden="true"><use href="#i-journal"/></svg>Journal</button>
  <button type="button" class="add" data-soon aria-label="Add trade"><span><svg aria-hidden="true" style="stroke-width:2.2"><use href="#i-plus"/></svg></span></button>
  <button type="button" data-soon><svg aria-hidden="true"><use href="#i-cal"/></svg>Calendar</button>
  <button type="button" data-soon><svg aria-hidden="true"><use href="#i-ins"/></svg>Insights</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supa.js"></script>
<script src="app.js"></script>
</body>
</html>
